name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - '.gitignore'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

          # SCAN DE SECRETS (TruffleHog)
    - uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies with uv
      run: |
        uv sync

    - name: Lint with flake8
      run: |
        # Arrête le build s'il y a des erreurs de syntaxe Python ou de variables non définies
        uv run flake8 src app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Avertissements légers
        uv run flake8 src app.py --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    # SCAN DOS & SÉCURITÉ CODE (Bandit)
    - name: Scan des faiblesses de code (Bandit)
      run: uvx bandit -r . -x ./.venv -ll

    # SCAN DE VULNÉRABILITÉS (Trivy)
    - name: Scan des vulnérabilités (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'